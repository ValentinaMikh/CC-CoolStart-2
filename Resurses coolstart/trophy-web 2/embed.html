<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кубок — пример встраивания</title><style>body{margin:0;background:#f3f1eb;font-family:Arial,sans-serif}#trophy{width:100%;height:min(80svh,700px);min-height:340px}button{display:block;margin:0 auto 24px;padding:12px 20px;border:1px solid #c8c2b3;border-radius:30px;background:transparent;color:#403923;font:inherit;cursor:pointer}</style></head><body><div id="trophy"></div><button type="button" id="motion" aria-pressed="true">Пауза</button><script src="./trophy-viewer.js"></script><script>const host=document.getElementById('trophy');const trophy=Trophy3D.mountTrophy(host,{autoplay:true});const motion=document.getElementById('motion');function sync(){motion.textContent=trophy.animation?'Пауза':'Плавное движение';motion.setAttribute('aria-pressed',String(trophy.animation));}motion.addEventListener('click',()=>{trophy.setAnimation(!trophy.animation);sync();});host.addEventListener('trophymotion',sync);sync();</script></body></html>
