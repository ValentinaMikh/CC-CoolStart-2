<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Золотой клевер — интерактивная 3D-модель</title>
<style>
*{box-sizing:border-box}html{color-scheme:light;--bg:#f1efea;--text:#302d26;--muted:#777167;--line:#d8d3c9;--button:#ffffffb3;--accent:#615030}html.dark{color-scheme:dark;--bg:#191b1d;--text:#f0ece2;--muted:#aaa69d;--line:#393b3b;--button:#292b2de8;--accent:#d7bb7e}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;transition:background .35s,color .35s}main{min-height:100svh;max-width:1600px;margin:auto;position:relative;display:flex;flex-direction:column;padding:34px 42px 25px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;position:relative;z-index:2}h1{font-weight:400;font-size:28px;letter-spacing:-1px;margin:9px 0 0}.eyebrow{font-size:10px;letter-spacing:2.1px;color:var(--muted)}button{font:inherit;font-size:12px;color:var(--text);border:1px solid var(--line);border-radius:100px;background:var(--button);padding:12px 17px;cursor:pointer;min-height:44px;transition:background .2s,border-color .2s}button:hover{border-color:var(--accent)}button[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg)}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[data-trophy-viewer]{width:100%;height:calc(100svh - 215px);min-height:420px;position:relative;flex:1}[data-trophy-viewer] canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}[data-trophy-viewer] canvas:active{cursor:grabbing}.loading{position:absolute;inset:45% 0 auto;text-align:center;color:var(--muted);font-size:14px}.zoom{position:absolute;right:0;top:46%;display:flex;flex-direction:column;gap:9px}.zoom button{width:44px;padding:0;font-size:22px}.bottom{flex-wrap:wrap;display:flex;justify-content:space-between;gap:16px;align-items:center;position:relative;z-index:2}.views{display:flex;gap:6px;flex-wrap:wrap}.views button{padding:11px 15px}.hint{color:var(--muted);font-size:11px;line-height:1.6;max-width:190px;margin:0}.motion{min-width:160px;text-align:center}footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:16px;margin-top:24px;color:var(--muted);font-size:10px;letter-spacing:.7px}.dot{display:inline-block;width:6px;height:6px;background:#a48a45;border-radius:50%;margin-right:7px}@media(max-width:680px){main{padding:23px 19px 20px}h1{font-size:24px}header button{padding:10px 13px;font-size:11px}[data-trophy-viewer]{height:54svh;min-height:330px}.bottom{flex-direction:column;gap:18px}.views{justify-content:center;gap:5px}.views button{font-size:11px;padding:11px 13px}.hint{max-width:none;text-align:center;order:2}.motion{order:1}.zoom{right:-6px;top:40%;gap:7px}.zoom button{width:40px;min-height:40px}footer{font-size:9px;letter-spacing:.2px}.eyebrow{font-size:9px;letter-spacing:1.7px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<header><div><span class="eyebrow">ОБЪЕКТ 01 / ИНТЕРАКТИВНАЯ МОДЕЛЬ</span><h1>Золотой клевер</h1></div><button type="button" data-theme aria-pressed="false">Тёмный фон</button></header>
<div style="position:relative;flex:1;display:flex"><div data-trophy-viewer><p class="loading" data-loading>Подготавливаем свет…</p></div><div class="zoom" aria-label="Масштаб"><button type="button" data-zoom="0.88" aria-label="Приблизить">+</button><button type="button" data-zoom="1.14" aria-label="Отдалить">−</button></div></div>
<div class="bottom"><p class="hint">Зажмите кубок на 2 секунды.<br>Перетаскивание — вращение.</p><div class="views" aria-label="Состояние"><button type="button" data-unlocked="false" aria-pressed="true">Не получен</button><button type="button" data-unlocked="true" aria-pressed="false">Получен</button></div><div class="views" aria-label="Ракурсы"><button type="button" data-view="perspective" aria-pressed="true">¾</button><button type="button" data-view="front" aria-pressed="false">Спереди</button><button type="button" data-view="side" aria-pressed="false">Сбоку</button><button type="button" data-view="back" aria-pressed="false">Сзади</button><button type="button" data-view="top" aria-pressed="false">Сверху</button></div><button type="button" class="motion" data-motion aria-pressed="true">Ⅱ Пауза</button></div>
<footer><span><span class="dot"></span>3D • ГЕОМЕТРИЯ ПО РЕФЕРЕНСУ</span><span>ЗОЛОТО / МЯГКИЙ СТУДИЙНЫЙ СВЕТ</span></footer>
</main><script>__BUNDLE__</script></body></html>
