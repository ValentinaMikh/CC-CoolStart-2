<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КуулКлевер — задание КуулСтарта</title>
<link rel="stylesheet" href="micro.css">
<script src="micro.js"></script>
<script src="steps.js"></script>
<style>
:root{--green:#80BA27;--ink:#1E1E1E;--ink-2:#4F4F4F;--ink-3:#808080;--ink-4:#DFDFDF;
  --sub:#F7F7F7;--hair:#E5E5E5;--hair-2:#D6D6D6;--olive:#DEE99B;--special:#FFEED6;--special-dark:#E88A01;--disable:#F0F1F3;--brand-soft:#E8F5D8;--dur:1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#0E0F10;font-family:"SF Pro Display",-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{transform-origin:center center}
.phone{width:375px;height:812px;position:relative;overflow:hidden;background:var(--sub);border-radius:44px;
  box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 10px #111,0 0 0 11px #2A2C2E;color:var(--ink)}
.screen{position:absolute;inset:0;overflow:hidden;border-radius:44px}

/* ===== Top Navigation (8284:139670): белая, статус-бар + навбар ===== */
.topnav{position:absolute;top:0;left:0;right:0;z-index:40;background:#fff;padding-bottom:8px;
  display:flex;flex-direction:column;align-items:center}
.status{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:15px;font-weight:600;color:var(--ink)}
.status .right{display:flex;align-items:center;gap:5px}
#devTap{padding:8px 4px 8px 12px;cursor:pointer}
.navbar{position:relative;width:100%;display:flex;align-items:center;padding:8px 16px;min-height:56px}
.back{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sub);
  display:grid;place-items:center;cursor:pointer;text-decoration:none}
.back img{width:20px;height:20px;display:block}
.nav-title{position:absolute;left:16.33%;right:16.33%;top:50%;transform:translateY(-50%);
  font-size:16px;line-height:20px;font-weight:600;color:var(--ink);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Promo page (8284:139648): скролл между шапкой 108 и таббаром 86 ===== */
.scroll{position:absolute;inset:108px 0 86px 0;overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{display:none}
.hero{width:375px;height:204px;background:var(--olive);overflow:hidden;position:relative}
.hero img{width:100%;height:100%;object-fit:cover;object-position:bottom;display:block}
.main{background:#fff;padding:16px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}


.body{width:100%;font-size:16px;line-height:20px;font-weight:400;color:var(--ink)}
.body b{font-weight:700}
.body p+p{margin-top:8px}
.h3{width:100%;font-size:18px;line-height:22px;font-weight:600;color:var(--ink)}
.bullets{width:100%;display:flex;flex-direction:column;gap:8px}
.bullets li{list-style:none;font-size:16px;line-height:20px;font-weight:400;color:var(--ink)}
.bullets li b{font-weight:600}

/* progress widget (8284:139656): заголовок + сегменты + подпись */
.pw{width:100%;display:flex;flex-direction:column;gap:16px}
.pw .head{width:100%;display:flex;gap:8px;align-items:flex-start}
.pw .head img{width:40px;height:24px;flex:none;display:block}
.pw .head .h3{flex:1;min-width:0}
.pw .progress{width:100%;display:flex;flex-direction:column;gap:8px;border-radius:8px}
.pw .scale{width:100%;display:flex;gap:8px;align-items:flex-start}
.pw .seg{flex:1;min-width:0;height:6px;border-radius:24px;background:var(--ink-4);overflow:hidden}
.pw .seg.on{background:var(--green)}
.pw .done{font-size:14px;line-height:18px;font-weight:500;color:var(--ink)}

/* Info Banner (8284:140293) */
.banner{width:343px;display:flex;gap:12px;align-items:center;padding:12px 16px;
  border-radius:12px;background:var(--special)}
.banner img{width:24px;height:24px;flex:none;display:block}
.banner p{flex:1;min-width:0;font-size:16px;line-height:20px;font-weight:500;color:var(--ink)}
/* Иконки акций внутри текста плашки (8366:114405, 114400, 114411).
   Иконка 24px выше строки 16/20, поэтому у плашки с иконками интерлиньяж чуть больше. */
.banner p .pi{width:24px;height:24px;display:inline-block;vertical-align:middle;margin-right:4px}
.banner p .pi:last-of-type{margin-right:0}
.banner p .pig{display:inline-block;white-space:nowrap}   /* тройка иконок не разрывается */
.banner.icons p{line-height:26px}

/* Second button (8284:139668) */
.btn{width:100%;display:flex;gap:8px;align-items:center;justify-content:center;padding:14px;
  border:0;border-radius:12px;background:var(--green);cursor:pointer;
  font-family:inherit;font-size:16px;line-height:20px;font-weight:500;color:#fff}

/* Купоны (8284:140294): строка с иконкой завода и разделителем */
.coupons{width:343px;display:flex;flex-direction:column;gap:8px}
.coupon{width:343px;display:flex;gap:8px;align-items:center;padding:8px 12px 9px 8px;
  border-bottom:1px solid var(--hair-2);overflow:hidden;cursor:pointer;background:none;
  font-family:inherit;text-align:left}
.coupon .logo{width:40px;height:40px;flex:none;display:block}
.coupon .txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.coupon .txt b{font-size:14px;line-height:18px;font-weight:500;color:var(--ink)}
.coupon .txt span{font-size:14px;line-height:18px;font-weight:400;color:var(--ink-2);
  height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coupon .st{width:20px;height:20px;flex:none;display:grid;place-items:center;color:var(--ink-3)}
.coupon.used{opacity:.55}

/* Карточки товаров подборки — компонент Product card UPD, как на главной */
.grid{width:343px;display:flex;gap:10px;overflow-x:auto}
.grid::-webkit-scrollbar{display:none}
.pcard{flex:none;width:164px;background:#fff;border:1px solid var(--hair);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column}
.pcard .pic{position:relative;width:100%;aspect-ratio:1/1;background:#D9D9D9;overflow:hidden}
.pcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pbody{padding:12px;display:flex;flex-direction:column;gap:6px}
.pcard .ttl{display:flex;gap:4px;align-items:flex-start;
  font-size:12px;line-height:14px;font-weight:500;color:var(--ink)}
.pcard .ttl i{flex:none;width:14px;height:14px;border-radius:50%;border:1px solid var(--ink-3);
  color:var(--ink-3);font-style:normal;font-size:10px;line-height:12px;text-align:center;cursor:pointer}
.pcard .old{font-size:12px;line-height:14px;color:var(--ink-2);text-decoration:line-through}
.pcard .cur{font-size:18px;line-height:22px;font-weight:600;color:#F45500}
.pcard .add{width:100%;min-height:32px;border:0;border-radius:8px;background:var(--green);
  font-family:inherit;font-size:12px;line-height:14px;font-weight:600;color:#fff;cursor:pointer}

/* Подарок на выбор (8364:31679): текст + карусель карточек 120×156 */
.gcont{width:343px;display:flex;flex-direction:column;gap:24px;align-items:center;padding:16px 0}
.gcont .tbox{width:100%;display:flex;flex-direction:column;gap:8px}
.gcont .tbox h4{font-family:Ubuntu,inherit;font-size:18px;line-height:1.4;font-weight:500;color:var(--ink)}
.gcont .tbox p{font-size:16px;line-height:20px;font-weight:400;color:var(--ink)}
.grail{width:359px;margin:0 -8px;padding:0 8px;display:flex;gap:12px;align-items:center;
  overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;cursor:grab}
.grail::-webkit-scrollbar{display:none}
.grail.dragging{cursor:grabbing;scroll-behavior:auto}
.grail.dragging *{pointer-events:none}
.gcard{flex:none;width:120px;border:2px solid transparent;border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;background:var(--disable);
  font-family:inherit;cursor:pointer}
.gcard .pic{position:relative;width:100%;height:120px;overflow:hidden;background:var(--disable)}
.gcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .veil{position:absolute;inset:0;background:rgba(255,255,255,.3);display:grid;place-items:center}
.gcard .veil img{width:24px;height:24px;object-fit:contain}
.gcard .cap{width:100%;padding:8px 4px;background:var(--disable);text-align:center;
  font-family:Ubuntu,inherit;font-size:14px;line-height:1.4;font-weight:500;color:var(--ink)}
.gcard.on{border-color:var(--green)}
.gcard.on .cap{background:var(--brand-soft)}
.gcard.off{cursor:default}

/* Модалка «Ваш подарок» (8364:113504) */
.gwin{display:flex;flex-direction:column;gap:24px;align-items:center;padding-top:8px}
.gh{font-family:Ubuntu,inherit;font-size:24px;line-height:1.2;font-weight:500;color:var(--ink);
  display:flex;gap:4px;align-items:center;text-align:center}
.gh .lab{background:var(--green);color:#fff;border-radius:8px;padding:2px 8px;
  transform:rotate(-2deg);font-weight:500}
.gbig{width:240px;border-radius:16px;overflow:hidden;background:var(--brand-soft);
  display:flex;flex-direction:column}
.gbig img{width:240px;height:240px;object-fit:cover;opacity:.8;display:block}
.gbig .cap{padding:12px 8px;text-align:center;font-family:Ubuntu,inherit;
  font-size:18px;line-height:1.4;font-weight:500;color:var(--ink)}

/* Модалка «Ваш Email» (8364:101368). Клавиатуру не рисуем — её показывает система. */
.fld{width:100%;padding:12px 16px;border:0;border-radius:12px;background:var(--sub);
  font-family:inherit;font-size:16px;line-height:20px;color:var(--ink)}
.fld::placeholder{color:var(--ink-3)}
.row2{display:flex;gap:8px;padding:16px 0}
.row2 .btn{flex:1}
.pol{font-size:14px;line-height:18px;font-weight:400;color:var(--ink-3)}
.pol u{font-weight:500}

/* ===== Tab Bar — как на главной ===== */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:#fff;
  display:flex;flex-direction:column;align-items:center}
.tab-panel{display:flex;width:100%;border-top:1px solid var(--hair);background:#fff}
.tab{flex:1;min-width:0;height:50px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:8px;position:relative;color:var(--ink-3);text-decoration:none}
.tab img{width:20px;height:20px;display:block}
/* :not(.badge) — иначе width:100% растягивает счётчик корзины на всю вкладку */
.tab span:not(.badge){font-size:10px;line-height:12px;font-weight:600;text-align:center;width:100%}
.tab.active span{color:var(--green)}
.badge{position:absolute;top:4px;right:12px;min-width:14px;height:14px;border-radius:60px;
  background:#F45500;border:2px solid #fff;color:#fff;font-size:10px;line-height:12px;
  display:grid;place-items:center;padding:1px}
.home-ind-wrap{width:100%;background:#fff;padding:22px 8px 8px;display:grid;place-items:center}
.home-ind-wrap i{width:134px;height:5px;border-radius:100px;background:var(--ink);display:block}

/* ===== Модалка промокода (8284:140204) ===== */
.m-scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:70;opacity:0;pointer-events:none;
  transition:.25s}
.m-scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;background:#fff;
  border-radius:24px 24px 44px 44px;padding:16px 16px 34px;transform:translateY(102%);
  transition:transform .34s cubic-bezier(.2,.85,.25,1);max-height:82%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet::-webkit-scrollbar{display:none}
.sheet .nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.sheet .nav h4{flex:1;text-align:center;font-size:16px;line-height:20px;font-weight:600;padding-left:36px}
.sheet .close{flex:none;width:36px;height:36px;border:0;border-radius:12px;background:var(--sub);
  display:grid;place-items:center;cursor:pointer}
/* билет купона: светлый верх, зубчатый разрез, оранжевый низ */
.ticket{border-radius:12px;overflow:hidden;margin-bottom:16px}
.ticket .top{background:var(--special);padding:16px;display:flex;gap:12px;align-items:flex-start}
.ticket .top img{width:40px;height:40px;flex:none;display:block}
.ticket .top b{font-size:18px;line-height:22px;font-weight:600;color:var(--ink)}
.ticket .top span{display:block;font-size:14px;line-height:18px;color:var(--ink-2)}
.ticket .cut{height:10px;background:var(--special-dark);
  -webkit-mask:radial-gradient(6px at 50% 0,transparent 98%,#000) 0 0/12px 10px repeat-x;
  mask:radial-gradient(6px at 50% 0,transparent 98%,#000) 0 0/12px 10px repeat-x}
.ticket .bottom{background:var(--special-dark);padding:4px 16px 16px;text-align:center}
.ticket .till{font-size:12px;line-height:16px;color:#fff;opacity:.9;margin-bottom:8px}
.ticket .code{display:flex;gap:8px;align-items:center;justify-content:center;
  border:1.5px dashed #fff;border-radius:24px;padding:10px;
  font-size:18px;line-height:22px;font-weight:700;color:#fff;letter-spacing:.5px}
.sheet .hint{font-size:14px;line-height:18px;color:var(--ink-2)}
.sheet .hint p+p{margin-top:8px}
.sheet .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.btn.soft{background:var(--sub);color:var(--ink)}
.btn.off{background:var(--sub);color:var(--ink-4);cursor:default}

/* тост-аннотация — как в index.html */
.note{position:absolute;left:16px;right:16px;bottom:100px;z-index:75;background:#17181A;color:#fff;
  border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.45;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;opacity:0;transform:translateY(10px);
  transition:.25s;pointer-events:none}
.note.on{opacity:1;transform:translateY(0)}
.note b{color:#A8E649}
</style>
</head>
<body>
<div id="stage">
<div class="phone">
<div class="screen">

  <div class="topnav">
    <div class="status">
      <div>9:41</div>
      <div class="right">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" width="3" height="11" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 11.2 6.1 8.7a3.4 3.4 0 0 1 4.8 0zM3.6 6.2 2 4.5a9.2 9.2 0 0 1 13 0l-1.6 1.7a6.9 6.9 0 0 0-9.8 0zM5.2 7.8 3.8 6.4a7 7 0 0 1 9.4 0l-1.4 1.4a5 5 0 0 0-6.6 0z"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.1 2.1 0 0 0 0-4z" fill="currentColor" opacity=".45"/></svg>
      </div>
    </div>
    <div class="navbar">
      <a class="back" href="coolstart.html" title="Назад к КуулСтарту"><img id="icBack" alt=""></a>
      <div class="nav-title" id="navTitle"></div>
    </div>
  </div>

  <div class="scroll" id="scroll"></div>

  <div class="tabbar" id="tabbar"></div>

  <div class="m-scrim" id="mScrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="note" id="note"></div>

</div>
</div>
</div>

<script>
/* ===== Ассеты из Figma (App Talk 26 → внутренние разделы КуулСтарта).
   URL живут ~7 дней; локально: curl -L -o assets/<имя> "<url>" и подменить путь ниже. ===== */
const RES='Resurses%20coolstart/';
const ICON={
  back:RES+'ic-back.svg',
  info:RES+'ic-info.svg',
  lock:RES+'ic-lock.svg',
  gift:RES+'Gift.svg'};

/* Иконки акций 24×24 для плашки задания «2+1, 3+1 или 5+1»
   (макеты 8366:114405, 8366:114400, 8366:114411 — файлы из папки) */
const PROMO_ICONS=[
 ['2+1','Resurses%20coolstart/2%2B1.png'],
 ['3+1','Resurses%20coolstart/3%2B1.png'],
 ['+1', 'Resurses%20coolstart/%2B1.png']];

const TABI=[
 ['Главная',RES+'ic-tab-home.svg'],
 ['Каталог',RES+'ic-tab-catalog.svg'],
 ['Акции',  RES+'ic-tab-promo.svg'],
 ['Корзина',RES+'ic-tab-cart.svg'],
 ['Профиль',RES+'ic-tab-profile.svg']];

/* Иконки заводов для строк купонов (в макете их 6, в ТЗ 10 категорий — циклим) */
const FACTORY=[1,2,3,4,5,6].map(n=>RES+'ic-cat-'+n+'.svg');

/* Фото-шапки внутренних страниц — файлы из папки «Resurses coolstart»,
   номер файла = номер шага чек-листа. У «КеГЛей Дня» и «КеГЛей Месяца»
   шапка общая (page 7-8). «Хиты» и «Разнообразие вкусов» живут на своих
   страницах: hits.html и tastes.html. Подложка — цвет секции чек-листа. */
const HERO={
 delivery   :{bg:'#DEE99B',src:'Resurses%20coolstart/check-list%20image%20page%203.jpg'},   /* шаг 3  курьер   */
 weekend    :{bg:'#DEE99B',src:'Resurses%20coolstart/check-list%20image%20page%204.jpg'},   /* шаг 4  подарок  */
 email      :{bg:'#FFC9B6',src:'Resurses%20coolstart/check-list%20image%20page%205.jpg'},   /* шаг 5  конверт  */
 push       :{bg:'#FFC9B6',src:'Resurses%20coolstart/check-list%20image%20page%206.jpg'},   /* шаг 6  колокольчик */
 'kgl-day'  :{bg:'#FFE3A2',src:'Resurses%20coolstart/check-list%20image%20page%207-8.jpg'},   /* шаг 7  КгЛ      */
 'kgl-month':{bg:'#FFE3A2',src:'Resurses%20coolstart/check-list%20image%20page%207-8.jpg'},   /* шаг 8  КгЛ      */
 'plus-one' :{bg:'#FFE3A2',src:'Resurses%20coolstart/check-list%20image%20page%209.jpg'},   /* шаг 9  монеты   */
 luch       :{bg:'#FFE3A2',src:'Resurses%20coolstart/check-list%20image%20page%2010.jpg'}};  /* шаг 10 х5 КгЛ   */

/* ===== 3.2.1 — 10 купонов ===== */
const COUPONS=[
 ['Скидка 15% на мясо и блюда для запекания','Мясо без шприцевания и натуральные маринады собственного приготовления и домашние рецепты. А главное — всё почти готово! Просто отправьте блюдо в духовку и отдыхайте в ожидании вкусного ужина.'],
 ['Скидка 25% на сосиски, сардельки и шпикачки','По ГОСТу и традиционным советским рецептам. Много свежего качественного мяса, натуральные специи и привычный вкус, который любят уже несколько поколений.'],
 ['Скидка 50% на пельмени, вареники и хинкали','Много сочной начинки и домашние рецепты. Каждое блюдо готовим с любовью, чтобы радовать вас натуральным вкусом!'],
 ['Скидка 30% на молочку от Молзавода МясновЪ Хлевное','Из молока высшего сорта без заменителей молочного жира. Бережная пастеризация сохраняет натуральный вкус и максимум белка в составе.'],
 ['Скидка 30% на ремесленный хлеб и выпечку','Хлеб длительной ферментации на живой закваске, выпечка на сливочном масле. Настоящий вкус, который начинается с качественных ингредиентов.'],
 ['Скидка 30% на пирожные, десерты и торты от Кондитерской МясновЪ','Натуральные сливки, сливочное масло и шоколад вместо заменителей. Десерты ручной работы, от которых невозможно отказаться!'],

function scale(total,used){
  return `<div class="scale">${Array.from({length:total},(_,i)=>
    `<div class="seg${i<used?' on':''}"></div>`).join('')}</div>`;
}
function pw(title,total,used,done,icon){
  /* Счётчик из ТЗ («… 0/1», «… 0/3») в заголовке не показываем — под ним
     и так стоит шкала с подписью. В данных формулировка остаётся дословной. */
  const t=String(title).replace(/\s+\d+\/\d+\s*$/,'');
  const head = icon
    ? `<div class="head"><img src="${icon}" alt=""><p class="h3">${esc(t)}</p></div>`
    : `<p class="h3">${esc(t)}</p>`;
  return `<div class="pw">${head}
    <div class="progress">${scale(total,used)}<div class="done">${esc(done)}</div></div></div>`;
}
function coupons(){
  return `<div class="coupons">${COUPONS.map((c,i)=>{
    const on=usedCoupons.has(i);
    return `<button class="coupon${on?' used':''}" data-c="${i}">
      <img class="logo" src="${FACTORY[i%FACTORY.length]}" alt="">
      <span class="txt"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></span>
      <span class="st">${on

        : `<img src="${ICON.lock}" alt="" style="width:20px;height:20px;display:block">`}</span>

}
function products(){

       <div class="pbody">
         <div class="ttl">${esc(p.n)}<i data-d="${i}" title="Описание товара">i</i></div>
         <div class="old">${esc(p.old)} ₽/шт</div>
         <div class="cur">${esc(p.c)} ₽/шт</div>
         <button class="add" data-add="${i}">В корзину</button>
       </div>
     </div>`).join('')}</div>`;
}

function block(b){
  switch(b.t){
    case 'h3':      return `<p class="h3">${esc(b.v)}</p>`;
    case 'text':    return `<div class="body">${b.v.map(p=>
                      `<p>${esc(p).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</p>`).join('')}</div>`;
    case 'bullets': return `<ul class="bullets">${b.v.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    case 'banner': {
      if(id==='email'&&giftChosen) return '';
      /* «[изображение иконок]» в ТЗ — это место под иконки акций, подставляем их */
      const txt=esc(b.v).replace('[изображение иконок]',
        '<span class="pig">'+PROMO_ICONS.map(([n,src])=>
          `<img class="pi" src="${src}" alt="${n}">`).join('')+'</span>');
      const cls=txt.includes('class="pi"') ? 'banner icons' : 'banner';
      return `<div class="${cls}"><img src="${ICON.info}" alt=""><p>${txt}</p></div>`;
    }
    case 'pw':      return pw(b.v,b.total,b.used,b.done,b.icon?ICON[b.icon]:'');
    case 'gift':    return `<div class="pw"><div class="head">`+
                      `<img src="${ICON.gift}" alt=""><p class="h3">${esc(b.v)}</p></div></div>`;
    case 'task': {
      /* задание засчитано — шкала заполнена целиком */
      const u = ((id==='email'&&emailOk) || Steps.isDone(id)) ? b.total : b.used;
      return pw(b.v,b.total,u,`Выполнено ${u} из ${b.total}`);
    }
    case 'coupons': return coupons();
    case 'products':return products();
    case 'giftbox': return giftbox();
    case 'giftbtn': return giftbtn();
    case 'btn':     return `<button class="btn" data-btn="${esc(b.v)}"`+
                             `${b.done?' data-done="1"':''}>${esc(b.v)}</button>`;
  }
  return '';
}

     Шкалы офферов (t:'pw') это не касается: они относятся к своему блоку текста. */

function giftbox(){
  const head = !emailOk ? ['Подарок на выбор','Откроется после выполнения задания']
    : !giftChosen       ? ['Подарок на выбор','Успейте выбрать в течении 14 дней']
    : !giftInCart       ? ['Ваш подарок','Успейте добавить в корзину в течении 14 дней']
    :                     ['Ваш подарок',''];
  const cards=GIFTS.map((g,i)=>{
    const on  = giftPick===i;

    return `<button class="gcard${on?' on':''}${off?' off':''}" data-gift="${i}"${off?' disabled':''}>

      <span class="cap">${esc(g.n)}</span></button>`}).join('');
  return `<div class="gcont">
    <div class="tbox"><h4>${esc(head[0])}</h4>${head[1]?`<p>${esc(head[1])}</p>`:''}</div>
    <div class="grail">${cards}</div></div>`;
}

/* Нижняя кнопка меняет подпись и активность вместе с состоянием */
function giftbtn(){
  if(giftInCart) return '';
  if(!emailOk)   return `<button class="btn" data-email>Добавить Email</button>`;
  if(!giftChosen) return `<button class="btn${giftPick===null?' off':''}" data-pick${
    giftPick===null?' disabled':''}>Выбрать</button>`;
  return `<button class="btn" data-cart>Добавить в корзину</button>`;
}

        <span><b>${esc(c[0])}</b><span>${esc(c[1])}</span></span></div>
      <div class="cut"></div>
      <div class="bottom">
        <div class="till">до 21 июля 2026 по промокоду</div>
        <div class="code">${code}</div>
      </div>
    </div>
    <div class="hint">
      <p>Покажите QR-код на кассе или примените купон при оформлении заказа в приложении — скидка на выбранную категорию товаров применится автоматически.</p>
      <p>За одну покупку можно использовать только один купон. Следующий купон станет доступен через 12 часов после покупки, в которой был использован предыдущий.</p>
    </div>
    <div class="btns">
      <button class="btn" data-apply="${i}">Применить к онлайн-заказу</button>
      <button class="btn soft" data-qr="${i}">Получить QR-код для кассы</button>
    </div>`;
  document.getElementById('sheetClose').onclick=()=>openSheet(false);
  openSheet(true);
}

/* Горизонтальная прокрутка карусели подарков: свайп на тачскрине работает сам,
   на десктопе добавляем колесо и перетаскивание мышью. Карусель пересоздаётся
   при каждом render(), поэтому слушаем на общем контейнере. */
(function(){
  const box=document.getElementById('scroll');
  const rail=e=>e.target.closest('.grail');
  box.addEventListener('wheel',e=>{
    const el=rail(e); if(!el) return;
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;          /* уже горизонтальный жест */
    const max=el.scrollWidth-el.clientWidth;
    if((e.deltaY<0&&el.scrollLeft===0)||(e.deltaY>0&&el.scrollLeft>=max-1)) return; /* край — отдаём странице */
    el.scrollLeft+=e.deltaY; e.preventDefault();
  },{passive:false});

  let el=null,id=null,x0=0,s0=0,moved=0;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return;                         /* нативный свайп не трогаем */
    el=rail(e); if(!el) return;
    id=e.pointerId; x0=e.clientX; s0=el.scrollLeft; moved=0;
  });
  box.addEventListener('pointermove',e=>{
    if(!el||e.pointerId!==id) return;
    const dx=e.clientX-x0;
    if(!moved&&Math.abs(dx)<4) return;
    if(!moved){ moved=1; el.classList.add('dragging'); el.setPointerCapture(id) }
    el.scrollLeft=s0-dx; e.preventDefault();
  });
  const stop=e=>{
    if(!el||e.pointerId!==id) return;
    if(moved) el.releasePointerCapture(id);
    el.classList.remove('dragging'); el=null; id=null;
  };
  box.addEventListener('pointerup',stop);
  box.addEventListener('pointercancel',stop);
  /* клик после перетаскивания не должен выбирать подарок */
  box.addEventListener('click',e=>{ if(moved){ e.stopPropagation(); moved=0 } },true);
})();

/* ===== события ===== */
document.getElementById('scroll').onclick=e=>{
  const c=e.target.closest('[data-c]');
  if(c){ coupon(+c.dataset.c); return }
  const d=e.target.closest('[data-d]');
  if(d){ showNote(`<b>Описание товара</b><br>${HIT_PRODUCTS[+d.dataset.d].d}`); return }
  if(e.target.closest('[data-add]')){ showNote('<b>Товар добавлен в корзину</b><br>Задание засчитывается после оплаты покупки.'); return }
  const g=e.target.closest('[data-gift]');
  if(g && !g.disabled){ giftPick=+g.dataset.gift; render(); return }
  if(e.target.closest('[data-email]')){ emailSheet(); return }
  const pk=e.target.closest('[data-pick]');
  if(pk && !pk.disabled){ giftSheet(giftPick); return }
  if(e.target.closest('[data-cart]')){
    giftChosen=true; giftInCart=true; render();
    showNote(`<b>${esc(GIFTS[giftPick].n)} в корзине</b><br>Подарок добавлен к заказу.`); return }
  const b=e.target.closest('[data-btn]');
  if(b){
    if(b.dataset.done) completeTask(b);
    else showNote(id==='push'
      ? '<b>Системный запрос на push-уведомления</b><br>Диалог показывает ОС — в прототипе заглушка.'
      : `<b>→ ${esc(b.dataset.btn)}</b><br>Целевой раздел приложения. В прототипе — заглушка.`);
  }
};

/* ===== Кнопка засчитывает задание =====
   Шкала задания заполняется, шаг уходит в общее состояние чек-листа —
   вернувшись в КуулСтарт, увидите его во вкладке «Выполненные». */
function completeTask(btn){
  if(Steps.isDone(id)){
    showNote('<b>Задание уже выполнено</b><br>Шаг отмечен в чек-листе КуулСтарта.');
    return;
  }
  Steps.complete(id);
  render();
  Micro.flash(document.querySelector('.pw .scale'));
  Micro.bump(document.querySelector('.pw .done'));
  Micro.bump(btn);
  showNote(id==='push'
    ? '<b>Уведомления разрешены</b><br>Задание засчитано — шаг отмечен в КуулСтарте.'
    : `<b>Задание засчитано</b><br>Шаг отмечен в КуулСтарте. Дальше — ${esc(btn.dataset.btn)}.`);
}
sheet.onclick=e=>{
  if(e.target.closest('[data-emok]')){
    const v=document.getElementById('emFld').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ showNote('<b>Проверьте адрес</b><br>Нужен email вида name@mail.ru'); return }
    /* адрес подтверждён — задание засчитано и уходит в чек-лист КуулСтарта */
    emailOk=true; Steps.complete('email'); openSheet(false); render();
    Micro.flash(document.querySelector('.pw .scale'));
    Micro.bump(document.querySelector('.pw .done'));
    showNote(`<b>Email подтверждён</b><br>${esc(v)} — задание засчитано, подарки открыты.`); return }
  if(e.target.closest('[data-emno]')){ openSheet(false); return }
  if(e.target.closest('[data-cart]')){
    giftChosen=true; giftInCart=true; openSheet(false); render();
    showNote(`<b>${esc(GIFTS[giftPick].n)} в корзине</b><br>Подарок добавлен к заказу.`); return }
  const a=e.target.closest('[data-apply]');
  if(a){ usedCoupons.add(+a.dataset.apply); openSheet(false); render();
    showNote('<b>Купон применён к онлайн-заказу</b><br>Следующий купон станет доступен через 12 часов.'); return }
  const q=e.target.closest('[data-qr]');
  if(q) showNote('<b>QR-код для кассы</b><br>Экран QR в макете не задан — заглушка.');
};

render();

/* Возврат из bfcache: шаг могли засчитать или сбросить на другом экране */
Steps.onRestore(()=>{
  emailOk=Steps.isDone(id);
  render();
});
</script>
</body>
