<style>
:root{--green:var(--t-primary);--accent:var(--t-accent);--ink:var(--t-text);--ink-2:var(--t-text-2);--ink-3:var(--t-text-3);--ink-4:#DFDFDF;
  --sub:var(--t-sub);--hair:var(--t-border);--olive:#DEE99B}
/* Ночью серые этой страницы идут своей лестницей: в библиотеке их нет.
   Фирменные подложки карточек при этом не трогаем — они цветные
   в обеих темах, как Primary и Accent. */
html.night{--ink-4:#3A3A3A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#0E0F10;font-family:"SF Pro Display",-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{transform-origin:center center}
.phone{width:375px;height:812px;position:relative;overflow:hidden;background:var(--sub);border-radius:44px;
  box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 10px #111,0 0 0 11px #2A2C2E;color:var(--ink)}
.screen{position:absolute;inset:0;overflow:hidden;border-radius:44px}

/* ===== Top Navigation (8330:60409) ===== */
.topnav{position:absolute;top:0;left:0;right:0;z-index:40;background:var(--t-ground);padding-bottom:8px;
  display:flex;flex-direction:column;align-items:center}
.status{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:15px;font-weight:600;color:var(--ink)}
.status .right{display:flex;align-items:center;gap:5px}
.navbar{position:relative;width:100%;display:flex;align-items:center;padding:8px 16px;min-height:56px}
.back{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sub);
  display:grid;place-items:center;cursor:pointer;text-decoration:none}
.back img{width:20px;height:20px;display:block}
.nav-title{position:absolute;left:16.33%;right:16.33%;top:50%;transform:translateY(-50%);
  font-size:16px;line-height:20px;font-weight:600;color:var(--ink);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scroll{position:absolute;inset:108px 0 86px 0;overflow-y:auto;overflow-x:hidden;background:var(--t-ground)}
.scroll::-webkit-scrollbar{display:none}
/* Content (8330:60279): белый, gap 24 */
.content{display:flex;flex-direction:column;gap:24px;align-items:flex-start;padding-bottom:24px}

.hero{position:relative;width:375px;height:204px;background:var(--olive);overflow:hidden;flex:none}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:bottom;display:block}

/* Main content (8330:60282): p16 gap16 */
.main{width:100%;padding:16px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.lead{width:100%;font-size:16px;line-height:20px;font-weight:400;color:var(--ink)}
.h3{width:100%;font-size:18px;line-height:22px;font-weight:600;color:var(--ink)}

/* progress widget (8330:60286) */
.pw{width:100%;display:flex;flex-direction:column;gap:16px}
.pw .progress{width:100%;display:flex;flex-direction:column;gap:8px;border-radius:8px}
.pw .scale{width:100%;display:flex;gap:8px}
.pw .seg{flex:1;min-width:0;height:6px;border-radius:24px;background:var(--ink-4)}
.pw .seg.on{background:var(--green)}
.pw .done{font-size:14px;line-height:18px;font-weight:500;color:var(--ink)}

/* mini-card list (8330:60293): px16 gap12 */
.minis{width:100%;padding:0 16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
/* Segmented-control (8330:60295) */
.seg2{width:343px;display:flex;padding:4px;border-radius:12px;background:var(--sub);overflow:hidden}
.seg2 button{flex:1;min-width:0;padding:8px;border:0;border-radius:12px;background:transparent;cursor:pointer;
  font-family:inherit;font-size:14px;line-height:18px;font-weight:500;color:var(--ink-2);text-align:center}
.seg2 button.on{background:var(--t-ground);color:var(--ink);
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.08)) drop-shadow(0 0 2px rgba(0,0,0,.04))}
.row{width:100%;display:flex;gap:12px;align-items:flex-start}

/* ===== Product card UPD (8330:60297) ===== */
.pcard{flex:none;width:164px;height:332px;background:var(--t-ground);border:1px solid var(--hair);
  border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.pcard .pic{position:relative;width:100%;height:160px;flex:none;padding:4px;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:flex-end}
.pcard .pic .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:block;pointer-events:none}
.fav{position:relative;flex:none;padding:8px;border:0;border-radius:12px;background:rgba(0,0,0,.4);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;cursor:pointer}
.fav img{width:20px;height:20px;display:block}
.pcard .pbody{flex:1;min-height:0;width:100%;padding:12px;display:flex;flex-direction:column;
  gap:6px;align-items:center;justify-content:center}
.pcard .badge-row{width:100%;display:flex;align-items:center}
.pcard .badge-row img{height:24px;width:auto;max-width:100%;display:block}
.pcard .ttl{width:100%;flex:1;min-height:0;overflow:hidden;text-overflow:ellipsis;
  font-size:12px;line-height:14px;font-weight:500;color:var(--ink)}
.prices{width:100%;display:flex;flex-direction:column}
.price{width:100%;display:flex;align-items:center;gap:4px;border-radius:3px}
.price.cur{justify-content:space-between}
.price .val{position:relative;display:flex;gap:2px;align-items:flex-start;white-space:nowrap}
.price .val b{font-size:18px;line-height:22px;font-weight:600}
.price .val i{font-size:12px;line-height:14px;font-weight:400;font-style:normal}
.price .units{font-size:12px;line-height:14px;font-weight:400;white-space:nowrap}
.price .grp{display:flex;gap:4px;align-items:center}
.price.old{color:var(--ink)}
.price.old .strike{position:absolute;top:4px;bottom:6px;left:0;right:0}
.price.old .strike svg{width:100%;height:100%;display:block;stroke:#808080}
.price.new{color:var(--accent)}
.price .info{width:16px;height:16px;flex:none;display:block}
.add{width:100%;height:34px;flex:none;padding:7px;border:0;border-radius:8px;background:var(--green);
  display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.add img{width:16px;height:16px;flex:none;display:block}
.add span{font-size:12px;line-height:14px;font-weight:500;color:#fff;white-space:nowrap}

/* ===== Редакционная карточка (8330:60330) ===== */
.ecard{flex:none;position:relative;width:164px;height:332px;border:1px solid var(--hair);
  border-radius:12px;overflow:hidden;cursor:pointer;background:#b88d5a}
.ecard .banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ===== Tab Bar ===== */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--t-ground);
  display:flex;flex-direction:column;align-items:center}
.tab-panel{display:flex;width:100%;border-top:1px solid var(--hair);background:var(--t-ground)}
.tab{flex:1;min-width:0;height:50px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:8px;position:relative;color:var(--ink-3);text-decoration:none}
.tab img{width:20px;height:20px;display:block}
.tab .lbl{font-size:10px;line-height:12px;font-weight:600;text-align:center;width:100%}
.tab.active .lbl{color:var(--green)}
.badge{position:absolute;top:4px;right:12px;min-width:14px;height:14px;border-radius:60px;
  background:var(--accent);border:2px solid var(--t-ground);color:#fff;font-size:10px;line-height:12px;
  display:grid;place-items:center;padding:1px}
.home-ind-wrap{width:100%;background:var(--t-ground);padding:22px 8px 8px;display:grid;place-items:center}
.home-ind-wrap i{width:134px;height:5px;border-radius:100px;background:var(--ink);display:block}

/* ===== Modal / Bottom Sheet (8330:60807) ===== */
.m-scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:70;opacity:0;pointer-events:none;
  transition:.25s}
.m-scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;background:var(--t-ground);
  border-radius:12px 12px 44px 44px;padding:16px 16px 0;transform:translateY(102%);
  transition:transform .34s cubic-bezier(.2,.85,.25,1);max-height:86%;
  display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet .nav{position:relative;width:100%;display:flex;gap:8px;align-items:center;justify-content:center;
  min-height:40px;flex:none}
.sheet .nav h4{position:absolute;left:16.33%;right:16.33%;top:50%;transform:translateY(-50%);

.sheet .close{flex:none;width:40px;height:40px;padding:10px;border:0;border-radius:12px;

.sheet .body{flex:1;min-height:0;overflow-y:auto;padding-top:16px;

.sheet .body::-webkit-scrollbar{display:none}

.mhero img{position:absolute;display:block;max-width:none}
.mhero .lum{position:absolute;inset:0;overflow:hidden;border-radius:12px;mix-blend-mode:luminosity}
.sheet .desc{font-size:16px;line-height:20px;font-weight:400;color:var(--ink)}
.sheet .panel{flex:none;padding:16px 0;display:flex;flex-direction:column;gap:8px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--green);cursor:pointer;
  font-family:inherit;font-size:16px;line-height:20px;font-weight:500;color:#fff}

.note{position:absolute;left:16px;right:16px;bottom:100px;z-index:75;background:#17181A;color:#fff;
  border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.45;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;opacity:0;transform:translateY(10px);
  transition:.25s;pointer-events:none}
.note.on{opacity:1;transform:translateY(0)}
.note b{color:#A8E649}
</style>
</head>

};

/* ===== состояние ===== */
let tab='otdohni';         /* активная вкладка — в макете 8330:59580 открыта «Отдохни» */
let taskDone=0;            /* «Выполнено 0 из 1» */
const TASK_TOTAL=1;
if(Steps.isDone('hits')) taskDone=TASK_TOTAL;   /* задание уже засчитано ранее */

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const note=document.getElementById('note');
let noteT;
function showNote(html){note.innerHTML=html;note.classList.add('on');
  clearTimeout(noteT);noteT=setTimeout(()=>note.classList.remove('on'),4200)}

const fit=()=>{
  /* телефон — во весь экран, без мокапа; десктоп — макет в рамке */
  if(Micro.fitFull(375)) return;
  const s=Math.min(innerWidth/415,innerHeight/852,1.35);
  document.getElementById('stage').style.transform=`scale(${s})`};
addEventListener('resize',fit);fit();

/* Тонкая линия зачёркнутой цены: рисуем сами, чтобы толщина не зависела
   от размера цены — vector-effect держит штрих ровно в 1px */
const STRIKE='<svg viewBox="0 0 100 100" preserveAspectRatio="none" fill="none">'
  +'<line x1="0" y1="100" x2="100" y2="0" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>';

/* ===== рендер ===== */
function pcard(it){
  const badge=it.badge?`<div class="badge-row"><img src="${it.badge}" alt=""></div>`:'';
  const old=it.old?`<div class="price old">
      <div class="grp"><span class="val"><b>${esc(it.old.v)}</b><i>${esc(it.old.c)}</i>
        <span class="strike">${STRIKE}</span></span>
        <span class="units">${esc(it.old.u)}</span></div>
    </div>`:'';
  const cur=`<div class="price cur ${it.old?'new':''}">
      <div class="grp"><span class="val"><b>${esc(it.price.v)}</b><i>${esc(it.price.c)}</i></span>
        <span class="units">${esc(it.price.u)}</span></div>
      ${it.old?`<img class="info" src="${ICON.info}" alt="">`:''}
    </div>`;
  return `<div class="pcard" data-open="${it.id}">
    <div class="pic">
      <img class="ph" src="${it.pic}" alt="">
      <button class="fav" data-fav="${it.id}" aria-label="В избранное"><img src="${ICON.fav}" alt=""></button>
    </div>
    <div class="pbody">
      ${badge}
      <div class="ttl">${esc(it.title)}</div>
      <div class="prices">${old}${cur}</div>
      <button class="add" data-add="${it.id}"><img src="${ICON.cart}" alt=""><span>Добавить</span></button>
    </div>
  </div>`;
}

function ecard(it){
  const e=it.ed;
  /* Баннер приходит готовой картинкой из папки «Resurses coolstart»:
     текст и стрелка впечатаны в неё, отдельные слои больше не собираем. */
  return `<div class="ecard" data-open="${it.id}" style="background:${e.bg}">
    <img class="banner" src="${e.img}" alt="${esc(e.text)}">
  </div>`;
}

/* Только шкала задания: вызывается и из render(), и при добавлении в корзину */
function renderTask(){
  if(v2()){ heroV2(); return }        /* в В1 шкала нарисована в шапке */
  document.getElementById('taskScale').innerHTML=
    Array.from({length:TASK_TOTAL},(_,i)=>`<div class="seg${i<taskDone?' on':''}"></div>`).join('');
  document.getElementById('taskDone').textContent=`Выполнено ${taskDone} из ${TASK_TOTAL}`;
}

/* Во втором варианте шапка своя: цветной блок с иллюстрацией, названием
   задания и шкалой (9215:34590). Блок задания из белого тела при этом
   убираем — он уже показан в шапке, а в навбаре остаётся номер шага. */
const v2=()=>Steps.design()===2;
function heroV2(){
  const hero=document.getElementById('hero');
  hero.className = 'hero '+V2Task.tone('');
  hero.innerHTML = V2Task.hero({pic:RES+'image.png', ttl:'Купить товар из подборки хитов',
    used:taskDone, total:TASK_TOTAL, check:RES+'ic-check.svg'});
  const pw=document.querySelector('.main .pw'); if(pw) pw.hidden=true;
  const n=Steps.IDS.indexOf('hits')+1;
  if(n) document.querySelector('.nav-title').textContent=`Задание ${n}`;
}

function render(animate){
  document.getElementById('icBack').src=ICON.back;
  if(v2()){ heroV2() }
  else document.getElementById('hero').innerHTML=HERO.filter(Boolean).map(h=>`<img src="${h}" alt="">`).join('');

  renderTask();

  [...segTabs.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  document.getElementById('rows').innerHTML=TABS[tab].items
    .map(it=>`<div class="row">${pcard(it)}${ecard(it)}</div>`).join('');
  Micro.reveal('.pw, .lead, .minis > .h3, .seg2, .row',{force:animate});

  document.getElementById('tabbar').innerHTML=
    `<div class="tab-panel">${TABI.map(([t,src,href],i)=>
      `<a class="tab${i===0?' active':''}" href="${href}">
         <img src="${src}" alt=""><span class="lbl">${t}</span>
         ${t==='Корзина'?'<span class="badge">13</span>':''}
       </a>`).join('')}</div>
     <div class="home-ind-wrap"><i></i></div>`;
}

/* ===== модалка описания товара (8330:60807) ===== */
const mScrim=document.getElementById('mScrim'), sheet=document.getElementById('sheet');
const openSheet=v=>{mScrim.classList.toggle('on',v);sheet.classList.toggle('on',v)};
mScrim.onclick=()=>openSheet(false);

function openProduct(id){
  const it=TABS[tab].items.find(x=>x.id===id); if(!it) return;
  sheet.innerHTML=`
    <div class="nav"><h4>${esc(it.modal.title)}</h4><div class="sp"></div>
      <button class="close" id="sheetClose" aria-label="Закрыть"><img src="${ICON.close}" alt=""></button>
    </div>
    <div class="body">
      <div class="mhero" style="background:${it.mhero.bg}">
        ${it.mhero.tex?`<span class="lum"><img src="${it.mhero.tex}" style="${TEX}" alt=""></span>`:''}
        ${it.mhero.layers.filter(l=>l.src).map(l=>`<img src="${l.src}" style="${l.css}" alt="">`).join('')}
      </div>
      <p class="desc">${esc(it.modal.text)}</p>
      <div class="panel"><button class="btn" data-add="${it.id}">Добавить в корзину</button></div>
    </div>`;
  document.getElementById('sheetClose').onclick=()=>openSheet(false);
  openSheet(true);
}

/* ===== события ===== */
const segTabs=document.getElementById('seg');
Micro.pill(segTabs);
segTabs.onclick=e=>{
  const b=e.target.closest('button'); if(!b || b.classList.contains('on')) return;
  tab=b.dataset.v;
  Micro.swap(document.getElementById('rows'), ()=>render(true));
};
document.getElementById('rows').onclick=e=>{
  const f=e.target.closest('[data-fav]');
  if(f){ Micro.bump(f,'pop'); showNote('<b>Добавлено в избранное</b>'); return }
  const a=e.target.closest('[data-add]');
  if(a){ addToCart(a.dataset.add); return }
  const o=e.target.closest('[data-open]');
  if(o) openProduct(o.dataset.open);
};
sheet.onclick=e=>{
  const a=e.target.closest('[data-add]');
  if(a){ openSheet(false); addToCart(a.dataset.add) }
};

/* покупка засчитывает задание — «Выполнено 1 из 1» */
function addToCart(id){
  const it=TABS[tab].items.find(x=>x.id===id);
  /* фото товара улетает в «Корзину», следом заполняется шкала задания */
  const pic=document.querySelector(`.pcard[data-open="${id}"] .ph`);
  const cart=[...document.querySelectorAll('#tabbar .tab')].find(t=>/Корзина/.test(t.textContent));
  if(pic&&cart) Micro.flyTo(pic,cart,{duration:520});
  setTimeout(()=>{
    const first=taskDone!==TASK_TOTAL;
    taskDone=TASK_TOTAL; Steps.complete('hits'); renderTask();
    if(first){ Micro.bump(document.getElementById('taskDone'));
               Micro.flash(document.getElementById('taskScale')) }
    showNote(`<b>${esc(it.title)}</b><br>Товар в корзине — задание засчитывается после оплаты.`);
  }, pic&&cart&&!Micro.reduced()?440:0);
}

render();

/* Возврат из bfcache: задание могли засчитать или сбросить на другом экране */
Steps.onRestore(()=>{
  taskDone=Steps.isDone('hits')?TASK_TOTAL:0;
  renderTask();
});
</script>
</body>
</html>
